name: Build Windows installer

on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Read version
        id: version
        shell: bash
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Protect source (obfuscate for the shipped build)
        run: node build/obfuscate.js

      - name: Build installer
        run: npx electron-builder --win --x64 --publish never

      - name: Keep the installer as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: RCWriter-Setup
          path: dist/*.exe

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: RCWriter ${{ steps.version.outputs.version }}
          make_latest: true
          overwrite_files: true
          body: |
            Download **RCWriter-Setup** below and double-click it to install.

            Windows may say "Windows protected your PC" because the installer isn't code-signed yet. Click **More info**, then **Run anyway**.
